# Local databases for development and the live driver tests.
#   ./dev/setup-ssh-key.sh && docker compose -f dev/docker-compose.yml up -d --wait
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kiyi
      POSTGRES_PASSWORD: kiyi
      POSTGRES_DB: shop
    ports: ["55432:5432"]
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./seed/postgres-test.sh:/docker-entrypoint-initdb.d/02-test.sh:ro
    healthcheck:
      # Healthy only once the seed has run, not just when the server accepts connections.
      test: ["CMD", "psql", "-U", "kiyi", "-d", "kiyi_test", "-c", "SELECT 1 FROM orders LIMIT 1"]
      interval: 2s
      retries: 60
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: kiyi
      MYSQL_DATABASE: shop
      MYSQL_USER: kiyi
      MYSQL_PASSWORD: kiyi
    ports: ["53306:3306"]
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./seed/mysql-test.sh:/docker-entrypoint-initdb.d/02-test.sh:ro
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-ukiyi", "-pkiyi", "-e", "SELECT 1 FROM kiyi_test.orders LIMIT 1"]
      interval: 2s
      retries: 90
  # SQL Server is big and runs emulated on Apple Silicon, so it only starts when asked for:
  #   docker compose -f dev/docker-compose.yml --profile sqlserver up -d --wait
  # then seed it with the command at the top of seed/sqlserver.sql.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Kiyi_pass1
      MSSQL_PID: Developer
    ports: ["51433:1433"]
    volumes:
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Kiyi_pass1 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 60
  bastion:
    build: ./bastion
    ports: ["52222:22"]
    volumes: ["./ssh/id_ed25519.pub:/home/kiyi/.ssh/authorized_keys:ro"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      retries: 30
