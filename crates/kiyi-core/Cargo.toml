[package]
name = "kiyi-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = "0.63.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
