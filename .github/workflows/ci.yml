name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    services: {}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm vite build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    # Catches Windows-only compile problems before a release build does.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm vite build
      - run: cargo check -p kiyi

  linux:
    # Catches Linux-only compile problems (WebKitGTK, the Secret Service) before a release build does.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm vite build
      - run: cargo clippy -p kiyi -p kiyi-core -- -D warnings

  e2e:
    # The real interface, clicked through in WebKit against the Docker databases (dev/flows.mjs):
    # editing, imports, tunnels, parameters, saved data, narrow windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: ./dev/setup-ssh-key.sh && docker compose -f dev/docker-compose.yml up -d --wait
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: cargo build -p kiyi-devbridge
      - name: Start the interface and the bridge
        run: |
          pnpm dev > vite.log 2>&1 &
          target/debug/kiyi-devbridge > bridge.log 2>&1 &
          for i in $(seq 90); do
            curl -sf http://localhost:1420 >/dev/null && curl -sf -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:1421/invoke/list_drivers >/dev/null && exit 0
            sleep 1
          done
          echo "::error::the interface or the bridge didn't start"; cat vite.log bridge.log; exit 1
      - run: mkdir -p flows && node dev/flows.mjs flows
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flows-screenshots
          path: flows

  audit:
    # Known vulnerabilities in dependencies. Accepted ones are listed, with reasons, in .cargo/audit.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  live-db:
    # Driver and tunnel tests against real PostgreSQL, MySQL and an SSH bastion (Linux runners have Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The keychain talks to the Secret Service over D-Bus on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: ./dev/setup-ssh-key.sh && docker compose -f dev/docker-compose.yml up -d --wait
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: KIYI_LIVE=1 cargo test -p kiyi-core --test live --test objects --test migrate
      - name: SQL Server
        run: |
          docker compose -f dev/docker-compose.yml --profile sqlserver up -d --wait sqlserver
          docker compose -f dev/docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Kiyi_pass1 -b -i /seed/sqlserver.sql
          KIYI_LIVE_SQLSERVER=1 cargo test -p kiyi-core --test sqlserver_live -- --test-threads=1
