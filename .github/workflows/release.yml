# Every push to main  → beta build   (vX.Y.Z-beta.N, prerelease) → beta channel
# Tag vX.Y.Z pushed   → stable build (vX.Y.Z)                     → stable + beta channels
#
# Users on the stable channel read releases/latest/download/latest.json.
# Users on the beta channel read the fixed `updater-beta` release, which this workflow rewrites.
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel=stable
          else
            # Betas are pre-releases of the next patch, so they sort above the current stable.
            last=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1)
            last="${last:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${last#v}"
            version="${major}.${minor}.$((patch + 1))-beta.${GITHUB_RUN_NUMBER}"
            channel=beta
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "### Kıyı $version ($channel)" >> "$GITHUB_STEP_SUMMARY"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--draft --title "Kıyı ${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --generate-notes)
          [[ "${{ steps.v.outputs.channel }}" == beta ]] && args+=(--prerelease)
          gh release create "${{ steps.v.outputs.tag }}" "${args[@]}"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        run: npm pkg set version=${{ needs.prepare.outputs.version }}
      - name: Apple signing (when configured)
        # Without these secrets the app is ad-hoc signed; set them to get a notarized build.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v<<EOF" >> "$GITHUB_ENV"; echo "${!v}" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::Apple signing secrets are not set; building an ad-hoc signed app."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.channel == 'beta' }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        run: |
          if [[ "${{ needs.prepare.outputs.channel }}" == stable ]]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false
          fi
      - name: Point the beta channel at this build
        # Stable releases go to beta users too, so they never sit on an older beta.
        run: |
          gh release download "$TAG" --pattern latest.json --dir out
          gh release view updater-beta >/dev/null 2>&1 || \
            gh release create updater-beta --prerelease --title "Beta update channel" \
              --notes "Kıyı uygulamasının beta güncelleme kanalı. Buradaki dosyaları elle değiştirme." --target "$GITHUB_SHA"
          gh release upload updater-beta out/latest.json --clobber
