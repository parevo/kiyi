# Every push to main  → beta build   (vX.Y.Z-beta.N, prerelease) → beta channel
# Tag vX.Y.Z pushed   → stable build (vX.Y.Z)                     → stable + beta channels
#
# Users on the stable channel read releases/latest/download/latest.json.
# Users on the beta channel read the fixed `updater-beta` release, which this workflow rewrites.
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel=stable
          else
            # Betas are pre-releases of the next patch, so they sort above the current stable.
            last=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1)
            last="${last:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${last#v}"
            version="${major}.${minor}.$((patch + 1))-beta.${GITHUB_RUN_NUMBER}"
            channel=beta
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "### Kiyi $version ($channel)" >> "$GITHUB_STEP_SUMMARY"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--draft --title "Kiyi ${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --generate-notes)
          [[ "${{ steps.v.outputs.channel }}" == beta ]] && args+=(--prerelease)
          gh release create "${{ steps.v.outputs.tag }}" "${args[@]}"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        run: npm pkg set version=${{ needs.prepare.outputs.version }}
      - name: Apple signing (when configured)
        if: runner.os == 'macOS'
        shell: bash
        # Without these secrets the app is ad-hoc signed. With them it's signed with a
        # Developer ID and notarized, using an App Store Connect API key (preferred) or
        # an Apple ID with an app-specific password.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { echo "$1<<EOF" >> "$GITHUB_ENV"; echo "$2" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"; }
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::Apple signing secrets are not set; building an ad-hoc signed app."
            exit 0
          fi
          put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [[ -n "$APPLE_API_PRIVATE_KEY" ]]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            put APPLE_API_KEY "$APPLE_API_KEY"
            put APPLE_API_KEY_PATH "$key"
          elif [[ -n "$APPLE_ID" ]]; then
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            echo "::warning::No notarization credentials; the app is signed but not notarized."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.channel == 'beta' }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Check the signature
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          app=$(find target -maxdepth 5 -path "*/bundle/macos/*.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier"
          if [[ -n "$APPLE_API_KEY_PATH$APPLE_ID" ]]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        run: |
          if [[ "${{ needs.prepare.outputs.channel }}" == stable ]]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false
          fi
      - name: Point the beta channel at this build
        # Stable releases go to beta users too, so they never sit on an older beta.
        run: |
          gh release download "$TAG" --pattern latest.json --dir out
          gh release view updater-beta >/dev/null 2>&1 || \
            gh release create updater-beta --prerelease --title "Beta update channel" \
              --notes "Update feed for the Kiyi beta channel. Managed by CI; do not edit these files by hand." --target "$GITHUB_SHA"
          gh release upload updater-beta out/latest.json --clobber
